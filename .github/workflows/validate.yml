name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint with Ruff
        run: uv run ruff check --diff

      - name: Check Ruff formatting
        run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Test with Pytest
        run: uv run pytest --junitxml=junit.xml -o junit_family=legacy

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: uv sync --no-dev --extra docs

      - name: Build documentation strictly
        run: uv run mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Confirm tag matches project version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          VERSION=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Install release tooling
        run: uv sync --group dev

      - name: Build and validate distributions
        run: |
          uv build
          uv run twine check dist/*

      - name: Smoke-test installed wheel
        run: |
          uv venv /tmp/qa-tool-wheel
          uv pip install --python /tmp/qa-tool-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/qa-tool-wheel/bin/qa-tool --version
          /tmp/qa-tool-wheel/bin/qa-tool --help
          /tmp/qa-tool-wheel/bin/qa-tool doctor --help

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
