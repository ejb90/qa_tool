name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*

  publish:
    needs: [validate, release]
    if: ${{ needs.validate.result == 'success' && needs.release.result == 'success' && vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: uv sync --group dev

      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        run: uv run twine upload --repository pypi dist/*

  trigger-rtd:
    needs: [release, publish]
    if: ${{ always() && needs.release.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      READTHEDOCS_API_KEY: ${{ secrets.READTHEDOCS_API_KEY }}
    steps:
      - name: Trigger Read the Docs build
        if: ${{ env.READTHEDOCS_API_KEY != '' }}
        env:
          READTHEDOCS_API_KEY: ${{ secrets.READTHEDOCS_API_KEY }}
        run: |
          curl --fail --request POST \
            --header "Authorization: Token ${READTHEDOCS_API_KEY}" \
            https://readthedocs.org/api/v3/projects/qa-tool/versions/latest/builds/
