name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Confirm tag matches project version
        run: |
          VERSION=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Install release tooling
        run: uv sync --group dev

      - name: Build and validate distributions
        run: |
          uv build
          uv run twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  release:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  publish-pypi:
    needs: validate-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  trigger-rtd:
    needs: [release, publish-pypi]
    if: ${{ needs.release.result == 'success' && needs.publish-pypi.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      READTHEDOCS_API_KEY: ${{ secrets.READTHEDOCS_API_KEY }}
    steps:
      - name: Trigger Read the Docs build
        if: ${{ env.READTHEDOCS_API_KEY != '' }}
        env:
          READTHEDOCS_API_KEY: ${{ secrets.READTHEDOCS_API_KEY }}
        run: |
          curl --fail --request POST \
            --header "Authorization: Token ${READTHEDOCS_API_KEY}" \
            https://readthedocs.org/api/v3/projects/qa-tool/versions/latest/builds/
