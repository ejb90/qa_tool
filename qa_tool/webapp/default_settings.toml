[page]
title = "Shock Bubble Interaction Run Database"
layout = "wide"

[database]
path = "runs.duckdb"
artifact_root = "./store"
# Maximum stale interval after user interaction; zero uses revision detection only.
cache_ttl_seconds = 60
# Maximum detailed rows materialized by one non-paginated dashboard view.
max_query_rows = 50000

[artifacts]
# Hard bounds applied while discovering, unpacking, reading, and plotting artifacts.
max_archive_members = 1000
max_expanded_bytes = 536870912
max_file_bytes = 134217728
max_recursive_files = 1000
max_render_rows = 10000
max_plot_points = 10000

[database.columns]
model = "model"
version = "version"

[intro]
description = "Interactive run database for shock bubble interaction regression and quality-assurance analysis."
show_database_path = true
show_artifact_root = true

[[intro.links]]
label = "Manual"
url = "https://github.com/ejb90/qa_tool#readme"

[[intro.links]]
label = "Source"
url = "https://github.com/ejb90/qa_tool"

[defaults]
# Empty table_metrics means "select every numeric metric".
table_metrics = []

[tables.all_runs]
# List database columns here to control the All Runs table's visible columns
# and their order. An empty list keeps every available column in database order.
columns = []

[summaries.default]
top = ["runs", "versions", "models"]
metrics = []
aggregations = []

[summaries.tabs.all_runs]
top = ["runs", "versions", "models"]
metrics = []
aggregations = []

[summaries.tabs.versions]
top = ["runs", "versions", "models"]
metrics = []
aggregations = []

[summaries.tabs.models]
top = ["runs", "versions", "models"]
metrics = []
aggregations = []

[summaries.tabs.compare_versions]
top = ["runs", "versions", "models"]
metrics = []
aggregations = []

[summaries.tabs.compare_collection]
top = ["runs", "versions", "models"]
metrics = []
aggregations = []

[summaries.tabs.compare_run]
top = ["runs", "versions", "models"]
metrics = []
aggregations = []

[summaries.tabs.pie_charts]
top = ["runs", "versions", "models"]
metrics = []
aggregations = []

[summaries.tabs.run_detail]
top = ["runs", "versions", "models"]
metrics = []
aggregations = []

[tabs]
all_runs = true
versions = true
models = true
compare_versions = true
compare_collection = true
compare_run = true
pie_charts = true
run_detail = true
saved_comparisons = true

[plots]
height = 520

[archive]
save_path = "qa_tool_archive"
search_paths = ["qa_tool_archive"]

[comparison.color_bounds]
# Optional fixed percentage-point bounds for coloured comparison cells.
# Unspecified metrics keep the current auto-scale behaviour.
# density = 0.1
# velocity = 0.05
