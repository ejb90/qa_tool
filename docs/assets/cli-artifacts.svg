<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">CLI export artifacts</title>
  <desc id="desc">A QA Tool CLI command produces a terminal table and adjacent HTML, PNG, CSV, and Parquet files for the plot's raw data and displayed table.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 21px; font-weight: 700; }
    .label { font-size: 16px; font-weight: 650; }
    .detail { font-size: 13px; fill: #4a5875; }
    .arrow { stroke: #66799f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#66799f"/></marker></defs>
  <rect width="1200" height="480" rx="22" fill="#f6f8fc"/>
  <text x="55" y="58" class="title">Every CLI plot can be reproduced from its adjacent data artifacts</text>
  <rect x="60" y="150" width="270" height="150" rx="15" fill="#252b3b"/>
  <text x="85" y="196" class="label" fill="#ffffff">qa_tool model …</text>
  <text x="85" y="229" class="detail" fill="#dae2f5">Rich table in terminal</text>
  <text x="85" y="257" class="detail" fill="#dae2f5">plot + data on disk</text>
  <rect x="470" y="105" width="250" height="95" rx="14" fill="#e7f1ff" stroke="#5593db" stroke-width="2"/>
  <text x="500" y="144" class="label">model_h2_density</text>
  <text x="500" y="171" class="detail">plot base name</text>
  <rect x="865" y="65" width="250" height="80" rx="14" fill="#fff1df" stroke="#dc9844" stroke-width="2"/>
  <text x="895" y="108" class="label">.html and .png</text>
  <rect x="865" y="190" width="250" height="80" rx="14" fill="#e6f7ef" stroke="#4eae79" stroke-width="2"/>
  <text x="887" y="233" class="label">.csv and .parquet</text>
  <rect x="865" y="315" width="250" height="80" rx="14" fill="#efe9ff" stroke="#8a71d2" stroke-width="2"/>
  <text x="885" y="350" class="label">_table.csv / parquet</text>
  <text x="885" y="375" class="detail">displayed aggregate table</text>
  <path d="M330 225 H470" class="arrow"/>
  <path d="M720 150 H865" class="arrow"/>
  <path d="M720 170 C790 170 780 230 865 230" class="arrow"/>
  <path d="M720 185 C800 185 785 355 865 355" class="arrow"/>
  <text x="877" y="129" class="detail">interactive / static plot</text>
  <text x="875" y="254" class="detail">raw plot input</text>
</svg>
