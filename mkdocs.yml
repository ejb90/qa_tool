site_name: QA Tool
site_description: DuckDB-backed QA run ingestion, analysis, and visualisation.
repo_url: https://github.com/ejb90/qa_tool
repo_name: ejb90/qa_tool

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.select
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Data model: database.md
  - Ingestion: ingestion.md
  - Web application: web-app.md
  - Deployment: deployment.md
  - Command line: cli.md
  - Python API:
      - Overview: api/index.md
      - Core library: api/core.md
      - Command-line interface: api/cli.md
      - Ingestion: api/ingest.md
  - Development: development.md
  - Releases: releases.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_section_style: table
            members_order: source
            separate_signature: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
